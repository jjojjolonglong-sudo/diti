<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 한국어 사전</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; }
    h1 { text-align: center; color: #333; margin-bottom: 25px; }
    
    /* API 설정 영역 스타일 */
    .api-settings { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
    .api-settings.active { display: block; }
    .api-input-group { display: flex; gap: 8px; margin-top: 8px; }
    .toggle-api-btn { background: none; border: none; color: #007bff; cursor: pointer; font-size: 14px; padding: 0; margin-bottom: 15px; text-decoration: underline; }
    
    /* 검색창 및 결과 스타일 */
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    .secondary-btn { background-color: #6c757d; }
    .secondary-btn:hover { background-color: #5a6268; }
    
    #result { line-height: 1.6; color: #444; }
    .word-item { border-bottom: 1px solid #eee; padding: 15px 0; }
    .word-item:last-child { border: none; }
    .word-title { font-size: 20px; font-weight: bold; color: #111; display: inline-block; margin-right: 10px; }
    .pos { font-size: 14px; color: #28a745; font-weight: bold; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; }
    .definition { margin-top: 8px; color: #555; }
    .error-msg { text-align: center; color: #dc3545; font-weight: bold; }
    .status-msg { text-align: center; color: #28a745; font-size: 14px; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 한국어 사전 앱</h1>
    
    <!-- API 설정 토글 버튼 -->
    <button class="toggle-api-btn" onclick="toggleApiSettings()">⚙️ API 인증키 설정 관리</button>

    <!-- API 설정 창 -->
    <div id="apiSettingsArea" class="api-settings">
      <label for="apiKeyInput" style="font-weight: bold; font-size: 14px;">국립국어원 Open API Key</label>
      <div class="api-input-group">
        <input type="password" id="apiKeyInput" placeholder="발급받은 API 키를 입력하세요">
        <button class="secondary-btn" onclick="saveApiKey()">저장</button>
      </div>
      <div id="apiStatus" class="status-msg"></div>
    </div>

    <!-- 검색창 -->
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="검색할 한국어 단어를 입력하세요" onkeypress="if(event.keyCode==13) searchKoreanWord()">
      <button onclick="searchKoreanWord()">검색</button>
    </div>

    <!-- 결과 출력 영역 -->
    <div id="result"></div>
  </div>

  <script>
    window.onload = function() {
      const savedKey = localStorage.getItem('korean_dict_api_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
        document.getElementById('apiStatus').innerText = '🔑 API 키가 안전하게 로드되었습니다.';
        document.getElementById('apiStatus').style.color = '#28a745';
      } else {
        toggleApiSettings();
        document.getElementById('apiStatus').innerText = '⚠️ 사전을 이용하려면 API 키를 먼저 입력하고 저장해주세요.';
        document.getElementById('apiStatus').style.color = '#dc3545';
      }
    };

    function toggleApiSettings() {
      const area = document.getElementById('apiSettingsArea');
      area.classList.toggle('active');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const status = document.getElementById('apiStatus');
      
      if (!key) {
        alert('API 키를 입력해주세요.');
        return;
      }
      
      localStorage.setItem('korean_dict_api_key', key);
      status.innerText = '✅ API 키가 성공적으로 저장되었습니다!';
      status.style.color = '#28a745';
      
      setTimeout(() => { toggleApiSettings(); }, 1000);
    }

    async function searchKoreanWord() {
      const word = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      const apiKey = localStorage.getItem('korean_dict_api_key');
      
      if (!apiKey) {
        resultDiv.innerHTML = '<p class="error-msg">API 인증키가 없습니다. 설정 메뉴를 열어 키를 등록해 주세요.</p>';
        toggleApiSettings();
        return;
      }

      if (!word) {
        resultDiv.innerHTML = '<p class="error-msg">단어를 입력해주세요.</p>';
        return;
      }

      resultDiv.innerHTML = '<p style="text-align:center; color:#666;">검색 중...</p>';

      // 주소 조합 오류 해결: 올바른 API URL과 CORS 프록시 주소 지정
      const proxyUrl = 'https://herokuapp.com';
      const targetUrl = `https://korean.go.kr{apiKey}&q=${encodeURIComponent(word)}&part=word&sort=popular`;

      try {
        const response = await fetch(proxyUrl + targetUrl);
        if (!response.ok) throw new Error('네트워크 응답에 문제가 있습니다.');

        const xmlText = await response.text();
        
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const items = xmlDoc.getElementsByTagName("item");

        if (items.length === 0) {
          resultDiv.innerHTML = '<p class="error-msg">검색 결과를 찾을 수 없습니다.</p>';
          return;
        }

        let htmlContent = '';
        const displayLimit = Math.min(items.length, 5);
        
        for (let i = 0; i < displayLimit; i++) {
          const item = items[i];
          
          // 데이터 파싱 안정성 보강 (Node 존재 여부 체크 후 가져오기)
          const wordNode = item.getElementsByTagName("word")[0];
          const posNode = item.getElementsByTagName("pos")[0];
          const defNode = item.getElementsByTagName("definition")[0];

          const wordName = wordNode ? wordNode.textContent : '단어 정보 없음';
          const pos = posNode ? posNode.textContent : '품사 없음';
          const definition = defNode ? defNode.textContent : '뜻 정의 없음';

          htmlContent += `
            <div class="word-item">
              <span class="word-title">${wordName}</span>
              <span class="pos">${pos}</span>
              <div class="definition">${definition}</div>
            </div>
          `;
        }

        resultDiv.innerHTML = htmlContent;

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = `
          <p class="error-msg">데이터를 가져오는 중 오류가 발생했습니다.</p>
          <p style="font-size:12px; color:#999; text-align:center;">API 키가 올바른지 확인하거나, <a href="https://herokuapp.comcorsdemo" target="_blank" style="color:#007bff; font-weight:bold;">CORS 데모 페이지</a>에 접속해 'Request temporary access...' 버튼을 클릭했는지 확인해 주세요.</p>
        `;
      }
    }
  </script>

</body>
</html>
