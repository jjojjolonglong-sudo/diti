<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 한국어 사전</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 25px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #result { line-height: 1.6; color: #444; }
    .word-item { border-bottom: 1px solid #eee; padding: 15px 0; }
    .word-item:last-child { border: none; }
    .word-title { font-size: 24px; font-weight: bold; color: #007bff; display: inline-block; margin-bottom: 10px; }
    .definition { font-size: 16px; color: #333; white-space: pre-line; }
    .error-msg { text-align: center; color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 실시간 한국어 사전 앱</h1>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="검색할 실제 한국어 단어를 입력하세요" onkeypress="if(event.keyCode==13) searchWord()">
      <button onclick="searchWord()">검색</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    // 1. JSONP 응답을 처리할 글로벌 전역 콜백 함수 정의 (CORS 해결 핵심)
    window.handleDictionaryResponse = function(data) {
      const resultDiv = document.getElementById('result');
      
      if (!data || !data.query || !data.query.pages) {
        resultDiv.innerHTML = '<p class="error-msg">데이터 처리 중 오류가 발생했습니다.</p>';
        return;
      }

      const pages = data.query.pages;
      const pageId = Object.keys(pages)[0];

      // 검색한 단어 페이지가 사전에 없는 경우 (-1 반환)
      if (pageId === "-1") {
        resultDiv.innerHTML = '<p class="error-msg">사전에서 검색 결과를 찾을 수 없습니다.</p>';
        return;
      }

      const title = pages[pageId].title;
      const extract = pages[pageId].extract;

      if (!extract) {
        resultDiv.innerHTML = '<p class="error-msg">단어 정의 데이터가 비어있습니다.</p>';
        return;
      }

      // 화면에 실시간 오픈 API 데이터 출력
      resultDiv.innerHTML = `
        <div class="word-item">
          <div class="word-title">${title}</div>
          <div class="definition">${extract}</div>
        </div>
      `;
    };

    // 2. 검색 시 동적으로 <script> 태그를 생성해 원격 API를 호출하는 함수
    function searchWord() {
      const word = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!word) {
        resultDiv.innerHTML = '<p class="error-msg">단어를 입력해주세요.</p>';
        return;
      }

      resultDiv.innerHTML = '<p style="text-align:center; color:#666;">실시간 사전 데이터 가져오는 중...</p>';

      // 기존에 생성되어 있던 API 호출용 스크립트 태그가 있다면 삭제
      const oldScript = document.getElementById('dictApiScript');
      if (oldScript) oldScript.remove();

      // JSONP 방식을 활용하여 위키낱말사전 실시간 데이터 요청 API URL 생성 (CORS 완전 회피)
      const apiUrl = `https://wiktionary.org{encodeURIComponent(word)}&callback=handleDictionaryResponse`;

      // 브라우저 SOP 정책을 완전히 우회하기 위해 <script src="API주소"> 태그 삽입
      const script = document.createElement('script');
      script.id = 'dictApiScript';
      script.src = apiUrl;
      
      // 태그를 헤더에 붙여 실제 통신 실행
      document.head.appendChild(script);
    }
  </script>

</body>
</html>
