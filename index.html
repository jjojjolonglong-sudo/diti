<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 한국어 사전</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 25px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #result { line-height: 1.6; color: #444; }
    .word-item { border-bottom: 1px solid #eee; padding: 15px 0; }
    .word-item:last-child { border: none; }
    .word-title { font-size: 22px; font-weight: bold; color: #007bff; margin-bottom: 5px; }
    .definition { font-size: 15px; color: #333; white-space: pre-line; margin-top: 5px; }
    .error-msg { text-align: center; color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 실시간 한국어 사전</h1>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="검색할 한국어 단어를 입력하세요 (예: 나무, 사랑, 하늘)" onkeypress="if(event.keyCode==13) searchKoreanWord()">
      <button onclick="searchKoreanWord()">검색</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    async function searchKoreanWord() {
      const word = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!word) {
        resultDiv.innerHTML = '<p class="error-msg">단어를 입력해주세요.</p>';
        return;
      }

      resultDiv.innerHTML = '<p style="text-align:center; color:#666;">사전 데이터를 조회 중입니다...</p>';

      // 💡 CORS 보안 정책을 완벽히 허용하는 글로벌 오픈소스 한국어 사전 데이터 허브 사용
      const apiUrl = `https://githubusercontent.com`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('네트워크 응답 오류');

        const totalData = await response.json();
        
        // 5만여 개의 정식 데이터 중 사용자가 입력한 단어와 정확히 일치하는 단어 필터링
        const matched = totalData.filter(item => item.word === word);

        if (matched.length === 0) {
          resultDiv.innerHTML = `<p class="error-msg">'${word}'에 대한 검색 결과를 정식 사전 데이터에서 찾을 수 없습니다.</p>`;
          return;
        }

        let htmlContent = '';
        matched.forEach(item => {
          htmlContent += `
            <div class="word-item">
              <div class="word-title">${item.word}</div>
              <div class="definition">${item.definition}</div>
            </div>
          `;
        });

        resultDiv.innerHTML = htmlContent;

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = '<p class="error-msg">사전 데이터를 가져오는 데 실패했습니다. 네트워크 상태를 확인해 주세요.</p>';
      }
    }
  </script>

</body>
</html>
