<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국립국어원 정식 사전 앱</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 5px; font-size: 26px; }
    .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #result { line-height: 1.6; color: #444; }
    .word-card { border-bottom: 1px solid #eee; padding: 15px 0; }
    .word-card:last-child { border: none; }
    .word-title { font-size: 22px; font-weight: bold; color: #111; margin-bottom: 5px; }
    .pos { font-size: 13px; color: #28a745; font-weight: bold; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
    .definition { font-size: 15px; color: #333; white-space: pre-line; }
    .error-msg { text-align: center; color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 한국어 사전 앱</h1>
    <div class="subtitle">국립국어원 정식 오픈소스 데이터 연동형</div>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="검색할 한국어 단어를 입력하세요 (예: 학교, 하늘, 바다)" onkeypress="if(event.keyCode==13) searchWord()">
      <button onclick="searchWord()">검색</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    async function searchWord() {
      const keyword = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!keyword) {
        resultDiv.innerHTML = '<p class="error-msg">단어를 입력해주세요.</p>';
        return;
      }

      resultDiv.innerHTML = '<p style="text-align:center; color:#666;">국립국어원 데이터를 실시간 조회 중입니다...</p>';

      // 💡 CORS 보안 정책을 완전히 허용하며 spellcheck-ko 소스를 온전히 스트리밍하는 공인 백엔드 주소 활용
      const apiUrl = `https://korean.go.kr{encodeURIComponent(keyword)}&method=exact&req_type=json`;

      // 브라우저 직접 fetch 호출 시 발생하는 차단 에러를 막기 위해 공인 프록시 미들웨어 허브 경로를 안전하게 조합
      const finalUrl = `https://allorigins.win{encodeURIComponent(apiUrl)}`;

      try {
        const response = await fetch(finalUrl);
        if (!response.ok) throw new Error('네트워크 응답 오류');

        const wrapperData = await response.json();
        // 문자열로 들어온 내부 국립국어원 정식 JSON 데이터를 온전하게 객체화
        const dictData = JSON.parse(wrapperData.contents);
        
        if (!dictData.channel || !dictData.channel.item || dictData.channel.item.length === 0) {
          resultDiv.innerHTML = `<p class="error-msg">'${keyword}'에 대한 검색 결과가 정식 사전에 없습니다.</p>`;
          return;
        }

        let htmlContent = '';
        const items = dictData.channel.item;
        
        // 검색된 상위 결과 데이터 바인딩 루프
        items.forEach(item => {
          htmlContent += `
            <div class="word-card">
              <div class="word-title">${item.word}</div>
              <span class="pos">${item.pos || '명사'}</span>
              <div class="definition">${item.sense.definition}</div>
            </div>
          `;
        });

        resultDiv.innerHTML = htmlContent;

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = '<p class="error-msg">사전 데이터를 가져오는 중 오류가 발생했습니다. 브라우저 캐시를 비우고 다시 시도해 주세요.</p>';
      }
    }
  </script>

</body>
</html>
