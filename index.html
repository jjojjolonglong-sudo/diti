<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diti 국어 사전</title>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/fonts.v1.js" data-app="diti"></script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#F1E9D6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="diti">
<script src="https://jjojjolonglong-sudo.github.io/mnmn/config.js"></script>
<style>
/* 콘셉트: 종이 사전. 따뜻한 크림 바탕, 남색 잉크, 버건디 포인트 하나. 모서리는 각지게 */
:root{--ink:#1F2A44;--paper:#FFFDF8;--bg:#F1E9D6;--acc:#8C2438;--accd:#701B2C;--cy:#8C2438;--dng:#B4452F;--mute:#6B6354;--tint:#EFE4CA;--line:#CDBF9A;--sel:#F7F0DE}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-width:300px;color:var(--ink);background-color:var(--bg);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
.btn,.sheet,dialog,.tab,#login,.logo{--bgc:var(--paper);background:var(--bgc);border-radius:0}
#app{max-width:680px;margin:0 auto;padding:10px 10px 6px;height:100vh;height:min(100dvh,900px);display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{--bgc:var(--acc);color:#fff;margin:0;font-family:'Noto Serif KR','Nanum Myeongjo','Batang',serif;font-size:20px;font-weight:800;letter-spacing:.02em;border:1.5px solid var(--acc);padding:0 10px}
.sub{font-weight:700;font-size:13px;flex:1}
.tabs{flex:none;display:flex;gap:4px;padding-left:8px;margin-bottom:-1.5px;position:relative;z-index:2}
.tab{--bgc:#E7DCC1;font:inherit;font-weight:700;padding:5px 12px 4px;margin-top:7px;border:1.5px solid var(--ink);border-bottom:0;color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{--bgc:var(--paper);margin-top:0;padding-top:10px;border-top:3px solid var(--acc)}
.sheet{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;border:1.5px solid var(--ink);padding:0 10px 12px}
.stick{position:sticky;top:0;z-index:3;background:var(--paper);padding:10px 10px 6px;margin:0 -10px;display:flex;gap:6px}
button{font:inherit;color:inherit}
.btn{font-weight:700;border:1.5px solid var(--ink);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.pri{--bgc:var(--acc);color:#fff}.btn.dng{--bgc:var(--dng);color:#fff}
.btn:hover:not(:disabled){--bgc:var(--sel)}.btn.pri:hover:not(:disabled){--bgc:var(--accd)}.btn.dng:hover:not(:disabled){--bgc:#963A27}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--cy);outline-offset:-5px}
input[type=text],input[type=email],input[type=password],textarea{display:block;width:100%;font:inherit;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:6px 8px;border-radius:0}
textarea{resize:vertical}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--cy);outline-offset:1px}
label.f{display:block;font-weight:700;font-size:12px;margin-top:8px}label.f>*{margin-top:2px;font-weight:400}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
/* 검색 결과 */
.ent{padding:8px 0 7px;border-bottom:1px dashed var(--line)}.ent:last-child{border-bottom:0}
.eh{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.w{font-weight:900;font-size:17px;font-family:'Noto Serif KR','Nanum Myeongjo','Batang',serif}
.pos{font-size:11px;font-weight:700;background:var(--tint);padding:0 6px}
.have{font-size:11px;font-weight:700;color:#0f7a4c}
.sl{display:flex;gap:6px;align-items:flex-start;padding:2px 0;cursor:pointer}
.sl input{margin:3px 0 0;flex:none}
.eb{display:flex;gap:6px;margin-top:4px}
/* 단어장 */
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:baseline;padding:5px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.row:hover{background:var(--sel)}
.addbox{border:1.5px dashed var(--line);padding:6px 8px;margin:6px 0}.addbox summary{cursor:pointer;font-weight:700;font-size:13px}
.xr{display:flex;gap:6px;margin:5px 0}.xr>*{min-width:0;flex:1}
.addbox input,.addbox select,.addbox textarea,.xi input,.xi select,.xi textarea{font:inherit;font-size:13px;border:1px solid var(--line);padding:3px 5px;background:#fff;width:100%;box-sizing:border-box}
.xi{padding:6px 2px;border-bottom:1px dashed var(--line)}.xi .xh{display:flex;gap:6px;align-items:center;margin-bottom:4px}.xi .xh b{flex:none}.xi .xh select{flex:1}
.xi .xr{margin:4px 0}.xi.dirty{background:#FFF3D6}.xi .ok{font-size:11px;color:#0f7a4c}
.it.open>.row{background:var(--sel)}.it.open>.row .m{display:none}
.dt{padding:4px 4px 8px 12px;border-bottom:1px dashed var(--line);font-size:13px}
.dt ol{margin:2px 0 4px;padding-left:20px}.dt li{padding:1px 0}
.dt .nt{color:var(--mute);margin:2px 0}.dt h4{margin:6px 0 2px;font-size:11px;color:var(--mute)}
.ex{padding:2px 0 2px 8px;border-left:2px solid var(--tint)}.ex span{color:var(--mute);font-size:12px}
.sl.done{opacity:.55;cursor:default}.sl em{font-style:normal;font-size:11px;font-weight:700;color:#0f7a4c}
.row .m{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .u{font-size:11px;font-weight:700;color:var(--mute)}
dialog{border:1.5px solid var(--ink);padding:12px;width:min(440px,94vw);color:var(--ink)}
dialog::backdrop{background:#0006}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#login{max-width:300px;margin:14vh auto;padding:14px;border:1.5px solid var(--ink)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;z-index:99;max-width:90vw;font-size:13px}
</style>
</head>
<body>
<div id="login" hidden>
  <h1 class="logo" style="display:inline-block">diti</h1>
  <label class="f">이메일<input id="em" type="email" autocomplete="username"></label>
  <label class="f">비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="btns"><button class="btn pri" id="go">로그인</button></div><p class="hint" id="lmsg"></p>
</div>
<div id="app" hidden>
  <header class="top"><h1 class="logo">diti</h1><span class="sub">국어 사전 · 표준국어대사전</span><button class="btn sm" id="out">로그아웃</button></header>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="s" aria-selected="true">검색</button><button class="tab" role="tab" data-t="w" aria-selected="false" id="tw">단어장</button><button class="tab" role="tab" data-t="x" aria-selected="false">용례 입력</button></div>
  <main class="sheet">
    <section id="ps">
      <div class="stick"><input id="q" type="text" placeholder="단어를 입력하세요" autocomplete="off"><button class="btn pri" id="sb">검색</button></div>
      <pre id="dbg" hidden style="white-space:pre-wrap;word-break:break-all;font-size:11px;background:#f4f4f4;padding:6px;margin:6px 0"></pre><div id="res"><p class="empty">단어를 검색하고, 담고 싶은 뜻을 골라 단어장에 담으세요.</p></div>
    </section>
    <section id="pw2" hidden>
      <div class="stick"><input id="wq" type="text" placeholder="단어장에서 찾기 (단어·뜻)" autocomplete="off"></div>
      <div id="wl"></div>
    </section>
    <section id="px" hidden>
      <p class="hint">임시 입력 화면이에요. 행마다 책·쪽수·용례를 넣고 그 줄의 '저장'을 누르세요.</p>
      <details class="addbox" open><summary>＋ 새 용례 행 추가</summary>
        <div class="xr"><input id="n-w" list="wdl" placeholder="단어 (단어장에 있는 것)" autocomplete="off"><datalist id="wdl"></datalist>
        <select id="n-b"></select></div>
        <div class="xr"><input id="n-d" type="date"><input id="n-p" type="number" inputmode="numeric" placeholder="쪽수"><input id="n-c" type="text" placeholder="퍼센트 (예: 82)"></div>
        <textarea id="n-e" rows="2" placeholder="용례 문장"></textarea>
        <div class="btns"><button class="btn pri sm" id="n-add">추가</button></div>
      </details>
      <div class="stick"><label class="sl" style="margin:0"><input type="checkbox" id="x-empty" checked><span>용례가 빈 행만 <b id="x-n"></b></span></label><input id="x-q" type="text" placeholder="단어 찾기" autocomplete="off"></div>
      <div id="xl"></div>
    </section>
  </main>
</div>
<dialog id="ed"><form method="dialog" id="edf" onsubmit="return false">
  <label class="f">단어<input id="e-w" type="text"></label>
  <label class="f">뜻 (1. 뜻 / 2. 뜻 형식)<textarea id="e-m" rows="5"></textarea></label>
  <label class="f">메모<textarea id="e-n" rows="2"></textarea></label>
  <p class="hint" id="e-h"></p>
  <div class="btns"><button class="btn pri" id="e-save" type="button">저장</button><button class="btn dng" id="e-del" type="button">삭제</button><button class="btn" id="e-x" type="button">닫기</button></div>
</form></dialog>
<div id="toast" hidden></div>
<script>
const CFG=window.APP_CONFIG||{};
const SB=CFG.SB||'https://rtvvajhsnwkkrmncyfbs.supabase.co',ANON=CFG.ANON||'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3000)};
const guard=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message)}};
const wkey=x=>String(x||'').trim().toLowerCase(),lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
/* 뜻 저장 형식: 한 줄 "1. 뜻 / 2. 뜻" (bkbk 한 줄 입력칸에서도 안 깨짐). 읽을 때는 줄바꿈도 같이 인식 */
const senseList=m=>{const o=[];lines(m).forEach(l=>l.split(/\s*\/?\s+(?=\d+\.\s)/).forEach(p=>{p=p.replace(/^\d+\.\s*/,'').trim();if(p)o.push(p)}));return o};
const fmtSenses=a=>a.length>1?a.map((x,i)=>`${i+1}. ${x}`).join(' / '):(a[0]||'');
const nrm=x=>String(x||'').replace(/[\s.。,]/g,'').toLowerCase(),wk2=x=>wkey(x).replace(/[\s\-^·0-9]/g,'');
const sameSense=(a,b)=>{a=nrm(a);b=nrm(b);return !!a&&!!b&&(a===b||(Math.min(a.length,b.length)>=6&&(a.includes(b)||b.includes(a))))};

/* ---------- 로그인 / REST ---------- */
let SES=null;try{SES=JSON.parse(localStorage.getItem('diti_ses')||'null')}catch(e){}
const saveSes=s=>{SES=s;try{s?localStorage.setItem('diti_ses',JSON.stringify(s)):localStorage.removeItem('diti_ses')}catch(e){}};
async function gotrue(grant,body){const r=await fetch(`${SB}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||'로그인 실패');j.expires_at=Date.now()+j.expires_in*1000;return j}
let rf=null;
async function token(){if(!SES)throw new Error('로그인이 필요해요');if(SES.expires_at-Date.now()<60000){rf=rf||gotrue('refresh_token',{refresh_token:SES.refresh_token}).then(saveSes).finally(()=>{rf=null});await rf}return SES.access_token}
async function api(method,path,body){
  const r=await fetch(SB+path,{method,headers:{apikey:ANON,Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.error))||('HTTP '+r.status));return j;
}
async function getAll(path){const out=[];for(let o=0;;o+=1000){const p=await api('GET',`${path}${path.includes('?')?'&':'?'}limit=1000&offset=${o}`);out.push(...p);if(p.length<1000)break}return out}

/* ---------- 상태 ---------- */
let W=[],U=new Map(),UL=new Map(),BN=new Map(),UA=[],R=[];   // 단어장, 단어별 bkbk 사용 횟수, 검색 결과
const sortW=()=>W.sort((a,b)=>String(a.word).localeCompare(String(b.word),'ko'));
async function loadAll(){
  const [w,u,b,sr]=await Promise.all([getAll('/rest/v1/diti_words?select=*&order=id'),getAll('/rest/v1/bkbk_word_use?select=id,word_id,book,date,page,pct,example&order=date,page').catch(()=>[]),getAll('/rest/v1/bkbk_books?select=id,series,label&order=id').catch(()=>[]),getAll('/rest/v1/bkbk_series?select=id,name&order=id').catch(()=>[])]);
  W=w;sortW();U=new Map();UL=new Map();const SN=new Map(sr.map(x=>[String(x.id),x.name]));BN=new Map(b.map(x=>{const n=SN.get(String(x.series))||x.series||'',l=String(x.label||'').trim();return [String(x.id),l?`${n} [${l}]`:String(n)]}));UA=u;reindex();renderW();$('#tw').textContent=`단어장 ${W.length}`;
}
function reindex(){U=new Map();UL=new Map();UA.forEach(x=>{const k=String(x.word_id);U.set(k,(U.get(k)||0)+1);(UL.get(k)||UL.set(k,[]).get(k)).push(x)})}
const cnt=()=>$('#tw').textContent=`단어장 ${W.length}`;

/* ---------- 탭 ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#ps').hidden=b.dataset.t!=='s';$('#pw2').hidden=b.dataset.t!=='w';$('#px').hidden=b.dataset.t!=='x';
  if(b.dataset.t==='x')renderX();else (b.dataset.t==='s'?$('#q'):$('#wq')).focus();
});

/* ---------- 검색 ---------- */
const has=w=>W.find(x=>wkey(x.word)===wkey(w))||W.find(x=>wk2(x.word)&&wk2(x.word)===wk2(w));
const savedSense=(w,s)=>{const x=has(w);return !!x&&senseList(x.meaning).some(t=>sameSense(t,s))};
async function search(){
  const q=$('#q').value.trim();if(!q)return toast('단어를 입력하세요');
  $('#sb').disabled=true;$('#res').innerHTML='<p class="empty">찾는 중…</p>';
  try{
    const r=await fetch(`${SB}/functions/v1/krdict`,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({q,debug:/[?&]debug/.test(location.search)})});
    const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error((d.error||d.message||'HTTP '+r.status));
    R=d.items||[];
    $('#dbg').hidden=!d.debug;if(d.debug)$('#dbg').textContent=JSON.stringify(d.debug,null,1);
    $('#res').innerHTML=R.length?R.map((it,i)=>`<div class="ent" data-i="${i}"><div class="eh"><b class="w">${E(it.word)}${it.sup?`<sup>${E(it.sup)}</sup>`:''}</b>${it.pos?`<span class="pos">${E(it.pos)}</span>`:''}<span class="have"${has(it.word)?'':' hidden'}>✔ 단어장에 있음</span>${it.full===false?'<span class="pos" title="상세 조회에 실패해서 검색 결과의 뜻만 보여요">뜻 일부</span>':''}</div>
      <div>${it.senses.map((s,j)=>`${savedSense(it.word,s)?`<label class="sl done"><input type="checkbox" data-s="${j}" disabled><span>${j+1}. ${E(s)} <em>✔ 담음</em></span></label>`:`<label class="sl"><input type="checkbox" data-s="${j}"><span>${j+1}. ${E(s)}</span></label>`}`).join('')}</div>
      <div class="eb"><button class="btn sm pri" data-save="${i}">선택한 뜻 담기</button><button class="btn sm" data-all="${i}">전체 선택</button></div></div>`).join(''):`<p class="empty">'${E(q)}' 검색 결과가 없어요. 다른 단어로 찾아보세요.</p>`;
  }catch(e){$('#res').innerHTML=`<p class="empty">검색하지 못했어요: ${E(e.message)}</p>`}
  finally{$('#sb').disabled=false}
}
const saveSenses=guard(async i=>{
  const it=R[i],box=document.querySelector(`.ent[data-i="${i}"]`),picked=[...box.querySelectorAll('input[data-s]:checked')].map(c=>it.senses[+c.dataset.s]);
  if(!picked.length)return toast('담을 뜻을 먼저 선택하세요');
  const ex=has(it.word);
  if(ex){const old=senseList(ex.meaning),add=picked.filter(p=>!old.some(t=>sameSense(t,p)));
    if(!add.length)return toast('이미 단어장에 있는 뜻이에요');
    const r=await api('PATCH',`/rest/v1/diti_words?id=eq.${ex.id}`,{meaning:fmtSenses([...old,...add])});ex.meaning=r[0].meaning;toast(`'${ex.word}'에 뜻 ${add.length}개를 더했어요`)}
  else{const r=await api('POST','/rest/v1/diti_words',{id:crypto.randomUUID(),word:it.word.trim(),meaning:fmtSenses(picked),note:''});W.push(r[0]);sortW();toast(`'${it.word}'를 단어장에 담았어요`)}
  cnt();renderW();R.forEach((x,k)=>{const bx=document.querySelector(`.ent[data-i="${k}"]`);if(!bx)return;bx.querySelector('.have').hidden=!has(x.word);bx.querySelectorAll('label.sl').forEach((l,j)=>{if(savedSense(x.word,x.senses[j])){const c=l.querySelector('input');c.checked=false;c.disabled=true;l.classList.add('done');if(!l.querySelector('em'))l.querySelector('span').insertAdjacentHTML('beforeend',' <em>✔ 담음</em>')}})});
});
$('#res').onclick=e=>{const s=e.target.closest('[data-save]'),a=e.target.closest('[data-all]');if(s)saveSenses(+s.dataset.save);if(a)document.querySelectorAll(`.ent[data-i="${a.dataset.all}"] input[data-s]:not(:disabled)`).forEach(c=>c.checked=true)};
$('#sb').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)search()});

/* ---------- 단어장 ---------- */
function renderW(){
  const q=wkey($('#wq').value),L=W.filter(w=>!q||wkey(w.word).includes(q)||wkey(w.meaning).includes(q));
  $('#wl').innerHTML=L.map(w=>{const n=U.get(String(w.id))||0;const o=OPEN.has(String(w.id));return `<div class="it${o?' open':''}" data-id="${w.id}"><div class="row"><b>${E(w.word)}</b><span class="u">${n?'×'+n:''}</span><span class="m">${E(fmtSenses(senseList(w.meaning)))}</span></div>${o?detail(w,n):''}</div>`}).join('')||`<p class="empty">${W.length?'찾는 단어가 없어요':'아직 담은 단어가 없어요. 검색 탭에서 담아 보세요.'}</p>`;
}
let _wt=null;$('#wq').oninput=()=>{clearTimeout(_wt);_wt=setTimeout(renderW,150)};
const OPEN=new Set();
function detail(w,n){
  const ss=senseList(w.meaning),us=(UL.get(String(w.id))||[]).slice().sort((a,b)=>String(BN.get(String(a.book))||'').localeCompare(String(BN.get(String(b.book))||''),'ko')||(+a.page||0)-(+b.page||0));
  const ex=us.map(u=>{const bk=BN.get(String(u.book))||'책',loc=u.page!=null&&u.page!==''?'p.'+u.page:(u.pct!=null&&u.pct!==''?Math.round(+u.pct*100)+'%':'');const t=String(u.example||'').trim();return `<div class="ex">${t?E(t):'<i>(용례 없음)</i>'} <span>(${E(bk)}${loc?'/'+E(loc):''})</span></div>`}).join('');
  return `<div class="dt">${ss.length?`<ol>${ss.map(x=>`<li>${E(x)}</li>`).join('')}</ol>`:'<p class="empty">뜻이 없어요</p>'}${w.note?`<div class="nt">${E(w.note)}</div>`:''}${ex?`<h4>용례</h4>${ex}`:''}<div class="btns"><button class="btn sm" data-edit="${w.id}">수정</button></div></div>`;
}
let EID=null;
$('#wl').onclick=e=>{const ed=e.target.closest('[data-edit]'),r=e.target.closest('.it');if(!r)return;
  if(!ed){const k=r.dataset.id;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);renderW();return}
  const w=W.find(x=>String(x.id)===r.dataset.id);if(!w)return;EID=w.id;
  $('#e-w').value=w.word;$('#e-m').value=fmtSenses(senseList(w.meaning));$('#e-n').value=w.note||'';
  const n=U.get(String(w.id))||0;$('#e-del').disabled=n>0;$('#e-h').textContent=n?`bkbk에서 ${n}번 쓰인 단어라 삭제할 수 없어요 (뜻·메모는 고칠 수 있어요)`:'';
  $('#ed').showModal()};
$('#e-x').onclick=()=>$('#ed').close();
$('#e-save').onclick=guard(async()=>{
  const w=W.find(x=>x.id===EID),word=$('#e-w').value.trim();if(!word)return toast('단어를 입력하세요');
  if(W.some(x=>x.id!==EID&&wkey(x.word)===wkey(word)))return toast('이미 단어장에 있는 단어예요');
  const r=await api('PATCH',`/rest/v1/diti_words?id=eq.${EID}`,{word,meaning:fmtSenses(senseList($('#e-m').value)),note:$('#e-n').value.trim()});
  Object.assign(w,r[0]);sortW();renderW();$('#ed').close();toast('저장했어요');
});
$('#e-del').onclick=guard(async()=>{
  const w=W.find(x=>x.id===EID);if((U.get(String(EID))||0)>0)return toast('bkbk에서 쓰인 단어는 삭제할 수 없어요');
  if(!confirm(`'${w.word}'을(를) 단어장에서 삭제할까요?`))return;
  await api('DELETE',`/rest/v1/diti_words?id=eq.${EID}`);W=W.filter(x=>x.id!==EID);cnt();renderW();$('#ed').close();toast('삭제했어요');
});

/* ---------- 용례 입력 (임시) ---------- */
let _bn=null,_bo=null;const BO=()=>{if(_bn!==BN){_bn=BN;_bo=[...BN].sort((a,b)=>a[1].localeCompare(b[1],'ko'))}return _bo},bsel=sel=>`<option value="">책 선택</option>`+(sel?`<option value="${E(sel)}" selected>${E(BN.get(String(sel))||'책')}</option>`:''),bopts=sel=>`<option value="">책 선택</option>`+BO().map(([id,n])=>`<option value="${E(id)}"${String(sel)===id?' selected':''}>${E(n)}</option>`).join('');
const WM2=()=>new Map(W.map(w=>[String(w.id),w.word]));
const pctIn=v=>{v=String(v||'').replace('%','').trim();if(v==='')return null;const n=parseFloat(v);return isNaN(n)?null:Math.round(n*100)/10000};
const pctOut=v=>v==null||v===''?'':(Math.round(+v*10000)/100);
const today=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
function renderX(){
  $('#wdl').innerHTML=W.map(w=>`<option value="${E(w.word)}">`).join('');
  if(!$('#n-b').options.length){$('#n-b').innerHTML=bopts('');$('#n-d').value=today()}
  const wm=WM2(),q=wkey($('#x-q').value),only=$('#x-empty').checked;
  let L=UA.filter(u=>(!only||!String(u.example||'').trim())&&(!q||wkey(wm.get(String(u.word_id))).includes(q)));
  $('#x-n').textContent=`(${L.length}/${UA.length})`;
  $('#xl').innerHTML=L.slice(0,150).map(u=>`<div class="xi" data-id="${u.id}"><div class="xh"><b>${E(wm.get(String(u.word_id))||'?')}</b><select data-f="book" data-lazy>${bsel(u.book)}</select></div>
    <div class="xr"><input data-f="page" type="number" inputmode="numeric" placeholder="쪽수" value="${E(u.page??'')}"><input data-f="pct" type="text" placeholder="퍼센트" value="${E(pctOut(u.pct))}"><input data-f="date" type="date" value="${E(u.date||'')}"></div>
    <textarea data-f="example" rows="2" placeholder="용례 문장">${E(u.example||'')}</textarea>
    <div class="btns" style="margin-top:4px"><button class="btn sm pri" data-xs>저장</button><span class="ok"></span></div></div>`).join('')+(L.length>150?`<p class="empty">${L.length-150}개 더 있어요. 저장하면 이 목록에서 줄어듭니다.</p>`:'')||'<p class="empty">표시할 행이 없어요</p>';
}
$('#x-empty').onchange=renderX;let _xt=null;$('#x-q').oninput=()=>{clearTimeout(_xt);_xt=setTimeout(renderX,200)};
const fillBook=e=>{const s=e.target.closest&&e.target.closest('select[data-lazy]');if(!s)return;const v=s.value;s.innerHTML=bopts(v);s.value=v;s.removeAttribute('data-lazy')};
$('#xl').addEventListener('pointerdown',fillBook,true);$('#xl').addEventListener('focusin',fillBook);
$('#xl').addEventListener('input',e=>{const r=e.target.closest('.xi');if(r)r.classList.add('dirty')});
$('#xl').addEventListener('change',e=>{const r=e.target.closest('.xi');if(r)r.classList.add('dirty')});
$('#xl').onclick=guard(async e=>{const b=e.target.closest('[data-xs]');if(!b)return;const r=b.closest('.xi'),u=UA.find(x=>String(x.id)===r.dataset.id),g=f=>r.querySelector(`[data-f="${f}"]`).value;
  const body={book:g('book')||null,page:g('page')===''?null:parseInt(g('page'),10),pct:pctIn(g('pct')),date:g('date')||null,example:g('example').trim()||null};
  if(!body.book)return toast('책을 선택하세요');
  const res=await api('PATCH',`/rest/v1/bkbk_word_use?id=eq.${u.id}`,body);Object.assign(u,res[0]);
  r.classList.remove('dirty');r.querySelector('.ok').textContent='✔ 저장됨';renderW();toast('저장했어요');
  if($('#x-empty').checked&&u.example)setTimeout(renderX,600);
});
$('#n-add').onclick=guard(async()=>{
  const w=has($('#n-w').value);if(!w)return toast('단어장에 있는 단어를 입력하세요');
  const book=$('#n-b').value;if(!book)return toast('책을 선택하세요');
  const body={id:crypto.randomUUID(),word_id:w.id,book,date:$('#n-d').value||today(),page:$('#n-p').value===''?null:parseInt($('#n-p').value,10),pct:pctIn($('#n-c').value),example:$('#n-e').value.trim()||null};
  if(body.page==null&&body.pct==null)return toast('쪽수나 퍼센트 중 하나는 넣어 주세요');
  const r=await api('POST','/rest/v1/bkbk_word_use',body);UA.push(r[0]);reindex();
  $('#n-w').value='';$('#n-p').value='';$('#n-c').value='';$('#n-e').value='';renderW();renderX();toast(`'${w.word}' 용례를 추가했어요`);$('#n-w').focus();
});

/* ---------- 시작 ---------- */
$('#go').onclick=async()=>{$('#lmsg').textContent='';try{saveSes(await gotrue('password',{email:$('#em').value.trim(),password:$('#pw').value}));show()}catch(e){$('#lmsg').textContent=e.message}};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out').onclick=()=>{saveSes(null);show()};
function show(){$('#login').hidden=!!SES;$('#app').hidden=!SES;if(SES){guard(loadAll)();$('#q').focus()}}
show();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
