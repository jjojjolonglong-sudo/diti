<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 한국어 사전</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 25px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #result { line-height: 1.6; color: #444; }
    .word-item { border-bottom: 1px solid #eee; padding: 15px 0; }
    .word-item:last-child { border: none; }
    .word-title { font-size: 20px; font-weight: bold; color: #111; display: inline-block; margin-right: 10px; }
    .definition { margin-top: 8px; color: #555; white-space: pre-line; }
    .error-msg { text-align: center; color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 한국어 사전 앱</h1>
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="검색할 한국어 단어를 입력하세요" onkeypress="if(event.keyCode==13) searchKoreanWord()">
      <button onclick="searchKoreanWord()">검색</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    async function searchKoreanWord() {
      const word = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!word) {
        resultDiv.innerHTML = '<p class="error-msg">단어를 입력해주세요.</p>';
        return;
      }

      resultDiv.innerHTML = '<p style="text-align:center; color:#666;">검색 중...</p>';

      // 위키낱말사전 Open API (CORS 우회를 위해 origin=* 파라미터 사용)
      const apiUrl = `https://wiktionary.org{encodeURIComponent(word)}&origin=*`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('네트워크 응답에 문제가 있습니다.');

        const data = await response.json();
        const pages = data.query.pages;
        const pageId = Object.keys(pages)[0];

        // 해당 단어 페이지가 없거나 결과가 정상적이지 않을 때 (-1은 페이지 없음 의미)
        if (pageId === "-1") {
          resultDiv.innerHTML = '<p class="error-msg">사전에서 검색 결과를 찾을 수 없습니다.</p>';
          return;
        }

        const extract = pages[pageId].extract;
        if (!extract) {
          resultDiv.innerHTML = '<p class="error-msg">단어의 정의가 비어있습니다.</p>';
          return;
        }

        // 결과 화면 구성
        resultDiv.innerHTML = `
          <div class="word-item">
            <span class="word-title">${pages[pageId].title}</span>
            <div class="definition">${extract}</div>
          </div>
        `;

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = '<p class="error-msg">네트워크 연결에 실패했거나 데이터를 가져오지 못했습니다.</p>';
      }
    }
  </script>

</body>
</html>
