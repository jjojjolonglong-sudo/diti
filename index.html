<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국어 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef2f4; --card:#fff; --ink:#1b2a33; --sub:#5d6f78; --line:#cfd8dc; --accent:#0f5c63; --tint:#e3eff0; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR','Malgun Gothic',sans-serif; display:flex; justify-content:center; }
  main { width:100%; max-width:560px; }
  h1 { font-family:'Noto Serif KR',serif; font-size:28px; margin:8px 0 4px; }
  .sub { color:var(--sub); font-size:14px; margin:0 0 24px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px; }
  .hidden { display:none; }
  label { display:block; font-size:14px; color:var(--sub); margin:12px 0 4px; }
  input { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:6px; font-family:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { font-family:inherit; font-size:16px; padding:12px 20px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.6; cursor:wait; }
  .row { display:flex; gap:10px; margin-top:18px; }
  .row button { flex:1; }
  .bar { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sub); margin-bottom:12px; }
  .bar button { padding:6px 12px; font-size:13px; }
  .search { display:flex; gap:10px; }
  .search input { flex:1; }
  #msg { margin-top:14px; font-size:14px; min-height:20px; }
  #msg.err { color:var(--err); }
  #msg.ok { color:var(--accent); }
  .entry { padding:18px 0; border-bottom:1px solid var(--line); }
  .entry:last-child { border-bottom:0; }
  .word { font-family:'Noto Serif KR',serif; font-weight:700; font-size:24px; }
  .pos { margin-left:8px; font-size:13px; color:var(--accent); background:var(--tint); padding:2px 8px; border-radius:4px; vertical-align:middle; }
  ol { margin:10px 0 0; padding-left:22px; line-height:1.7; }
  .empty { color:var(--sub); text-align:center; padding:24px 0 6px; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background .15s; } }
</style>
</head>
<body>
<main>
  <h1>국어 사전</h1>
  <p class="sub">한국어기초사전에서 단어 뜻을 찾아봅니다.</p>

  <!-- 로그인 -->
  <section id="auth" class="panel">
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="email">
    <label for="pw">비밀번호 (6자 이상)</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="row">
      <button id="loginBtn">로그인</button>
      <button id="signupBtn" class="ghost">회원가입</button>
    </div>
  </section>

  <!-- 사전 -->
  <section id="app" class="panel hidden">
    <div class="bar"><span id="who"></span><button id="logoutBtn" class="ghost">로그아웃</button></div>
    <div class="search">
      <input id="q" type="text" placeholder="단어를 입력하세요" autocomplete="off">
      <button id="searchBtn">검색</button>
    </div>
    <div id="result"></div>
  </section>

  <div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://rtvvajhsnwkkrmncyfbs.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const say = (t, type = "") => { $("msg").textContent = t; $("msg").className = type; };

  function show(session) {
    $("auth").classList.toggle("hidden", !!session);
    $("app").classList.toggle("hidden", !session);
    $("who").textContent = session ? session.user.email : "";
    if (session) $("q").focus();
  }

  async function login() {
    say("");
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value });
    if (error) say("로그인하지 못했습니다: " + error.message, "err");
  }

  async function signup() {
    say("");
    const { data, error } = await sb.auth.signUp({ email: $("email").value.trim(), password: $("pw").value });
    if (error) return say("가입하지 못했습니다: " + error.message, "err");
    if (!data.session) say("확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인하세요.", "ok");
  }

  async function search() {
    const q = $("q").value.trim();
    if (!q) return say("단어를 입력하세요.", "err");
    say(""); $("searchBtn").disabled = true; $("result").innerHTML = "";
    const { data, error } = await sb.functions.invoke("krdict", { body: { q } });
    $("searchBtn").disabled = false;
    if (error || data?.error) return say("검색하지 못했습니다: " + (data?.error || error.message), "err");
    if (!data.items.length) { $("result").innerHTML = `<p class="empty">'${esc(q)}' 검색 결과가 없습니다. 다른 단어로 찾아보세요.</p>`; return; }
    $("result").innerHTML = data.items.map((it) => `
      <div class="entry">
        <span class="word">${esc(it.word)}</span>${it.pos ? `<span class="pos">${esc(it.pos)}</span>` : ""}
        <ol>${it.senses.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
      </div>`).join("");
  }

  $("loginBtn").onclick = login;
  $("signupBtn").onclick = signup;
  $("logoutBtn").onclick = () => sb.auth.signOut();
  $("searchBtn").onclick = search;
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

  sb.auth.onAuthStateChange((_e, session) => show(session));
  sb.auth.getSession().then(({ data }) => show(data.session));
</script>
</body>
</html>
