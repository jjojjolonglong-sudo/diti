<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 한국어 사전 앱</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 25px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #result { line-height: 1.6; color: #444; }
    .word-card { border-bottom: 1px solid #eee; padding: 15px 0; }
    .word-card:last-child { border: none; }
    .word-title { font-size: 24px; font-weight: bold; color: #007bff; margin-bottom: 10px; }
    .definition { font-size: 16px; color: #333; white-space: pre-line; }
    .error-msg { text-align: center; color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 실시간 한국어 사전</h1>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="검색할 단어를 입력하세요 (예: 하늘, 컴퓨터)" onkeypress="if(event.keyCode==13) searchWord()">
      <button onclick="searchWord()">검색</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    // 1. 서버에서 전달된 단어 데이터를 안전하게 받아 화면에 그리는 글로벌 콜백 함수 (JSONP)
    window.onDictionaryLoad = function(data) {
      const resultDiv = document.getElementById('result');
      
      if (!data || !data.query || !data.query.pages) {
        resultDiv.innerHTML = '<p class="error-msg">데이터 응답 형식이 올바르지 않습니다.</p>';
        return;
      }

      const pages = data.query.pages;
      const pageId = Object.keys(pages);

      // 단어가 사전에 존재하지 않을 때 (-1 리턴)
      if (pageId[0] === "-1") {
        resultDiv.innerHTML = '<p class="error-msg">사전에서 검색 결과를 찾을 수 없습니다.</p>';
        return;
      }

      const title = pages[pageId[0]].title;
      const extract = pages[pageId[0]].extract;

      if (!extract) {
        resultDiv.innerHTML = '<p class="error-msg">단어 정의 데이터가 비어있습니다.</p>';
        return;
      }

      resultDiv.innerHTML = `
        <div class="word-card">
          <div class="word-title">${title}</div>
          <div class="definition">${extract}</div>
        </div>
      `;
    };

    // 2. 검색 시 브라우저 차단막(CORS)을 회피하여 데이터를 원격 호출하는 스크립트 주입 함수
    function searchWord() {
      const word = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!word) {
        resultDiv.innerHTML = '<p class="error-msg">단어를 입력해주세요.</p>';
        return;
      }

      resultDiv.innerHTML = '<p style="text-align:center; color:#666;">실시간 사전 데이터를 가져오는 중...</p>';

      // 기존에 남아있던 가상 통신용 스크립트 노드 제거
      const prevScript = document.getElementById('dictQueryScript');
      if (prevScript) prevScript.remove();

      // 💡 일반 fetch 요청 시 차단당하므로, 브라우저가 승인하는 전 세계 공용 JSONP(Callback) 단독 API 규격 사용
      const encodedWord = encodeURIComponent(word);
      const targetUrl = `https://wiktionary.org{encodedWord}&callback=onDictionaryLoad`;

      // 가상 스크립트 엘리먼트를 헤더에 주입하여 통신을 원격지로 강제 연결
      const scriptNode = document.createElement('script');
      scriptNode.id = 'dictQueryScript';
      scriptNode.src = targetUrl;
      
      document.head.appendChild(scriptNode);
    }
  </script>

</body>
</html>
