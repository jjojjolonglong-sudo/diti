<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diti 국어 사전</title>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/config.js"></script>
<style>
/* 콘셉트: wkwk와 같은 오피스풍 교정쇄. 격자 위의 종이, 한쪽 귀퉁이를 자른 네모 */
:root{--ink:#333B4F;--paper:#fff;--bg:#EBF1F6;--grid:#D6E4ED;--ye:#FFE600;--cy:#14B4DA;--mg:#E6338A;--mute:#5b6672;--tint:#E3EFF0}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-width:300px;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
.btn,.sheet,dialog,.tab,#login,.logo{--c:9px;--bgc:#fff;--lc:var(--ink);border-color:transparent!important;clip-path:polygon(0 0,calc(100% - var(--c)) 0,100% var(--c),100% 100%,0 100%);background:linear-gradient(225deg,transparent calc(var(--c)*.7071 - .62px),var(--bgc) 0) padding-box,linear-gradient(var(--lc),var(--lc)) border-box}
#app{max-width:680px;margin:0 auto;padding:10px 10px 6px;height:100vh;height:min(100dvh,900px);display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{--c:7px;--bgc:var(--ye);margin:0;font-family:'Courier New',monospace;font-size:20px;font-weight:800;border:1.5px solid var(--ink);padding:0 9px}
.sub{font-weight:700;font-size:13px;flex:1}
.tabs{flex:none;display:flex;gap:4px;padding-left:8px;margin-bottom:-1.5px;position:relative;z-index:2}
.tab{--c:8px;--bgc:#CFE0EA;font:inherit;font-weight:700;padding:5px 12px 4px;margin-top:7px;border:1.5px solid var(--ink);border-bottom:0;color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{--bgc:var(--ye);margin-top:0;padding-top:10px}
.sheet{--c:16px;position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;border:1.5px solid var(--ink);padding:0 10px 12px}
.stick{position:sticky;top:0;z-index:3;background:var(--paper);padding:10px 10px 6px;margin:0 -10px;display:flex;gap:6px}
button{font:inherit;color:inherit}
.btn{--c:7px;font-weight:700;border:1.5px solid var(--ink);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.pri{--bgc:var(--ye)}.btn.dng{--bgc:var(--mg);color:#fff}
.btn:hover:not(:disabled){--bgc:#F1F5F8}.btn.pri:hover:not(:disabled){--bgc:#F2D800}.btn.dng:hover:not(:disabled){--bgc:#D12A7A}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--cy);outline-offset:-5px}
input[type=text],input[type=email],input[type=password],textarea{display:block;width:100%;font:inherit;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:6px 8px;border-radius:0}
textarea{resize:vertical}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--cy);outline-offset:1px}
label.f{display:block;font-weight:700;font-size:12px;margin-top:8px}label.f>*{margin-top:2px;font-weight:400}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
/* 검색 결과 */
.ent{padding:8px 0 7px;border-bottom:1px dashed #9fb0bd}.ent:last-child{border-bottom:0}
.eh{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.w{font-weight:900;font-size:17px}
.pos{font-size:11px;font-weight:700;background:var(--tint);padding:0 6px}
.have{font-size:11px;font-weight:700;color:#0f7a4c}
.sl{display:flex;gap:6px;align-items:flex-start;padding:2px 0;cursor:pointer}
.sl input{margin:3px 0 0;flex:none}
.eb{display:flex;gap:6px;margin-top:4px}
/* 단어장 */
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:baseline;padding:5px 2px;border-bottom:1px dashed #cfdbe3;cursor:pointer}
.row:hover{background:#F4F8FA}
.row .m{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .u{font-size:11px;font-weight:700;color:var(--mute)}
dialog{--c:14px;border:1.5px solid var(--ink);padding:12px;width:min(440px,94vw);color:var(--ink)}
dialog::backdrop{background:#0006}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#login{--c:14px;max-width:300px;margin:14vh auto;padding:14px;border:1.5px solid var(--ink)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;z-index:99;max-width:90vw;font-size:13px}
</style>
</head>
<body>
<div id="login" hidden>
  <h1 class="logo" style="display:inline-block">diti</h1>
  <label class="f">이메일<input id="em" type="email" autocomplete="username"></label>
  <label class="f">비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="btns"><button class="btn pri" id="go">로그인</button></div><p class="hint" id="lmsg"></p>
</div>
<div id="app" hidden>
  <header class="top"><h1 class="logo">diti</h1><span class="sub">국어 사전 · 표준국어대사전</span><button class="btn sm" id="out">로그아웃</button></header>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="s" aria-selected="true">검색</button><button class="tab" role="tab" data-t="w" aria-selected="false" id="tw">단어장</button></div>
  <main class="sheet">
    <section id="ps">
      <div class="stick"><input id="q" type="text" placeholder="단어를 입력하세요" autocomplete="off"><button class="btn pri" id="sb">검색</button></div>
      <div id="res"><p class="empty">단어를 검색하고, 담고 싶은 뜻을 골라 단어장에 담으세요.</p></div>
    </section>
    <section id="pw2" hidden>
      <div class="stick"><input id="wq" type="text" placeholder="단어장에서 찾기 (단어·뜻)" autocomplete="off"></div>
      <div id="wl"></div>
    </section>
  </main>
</div>
<dialog id="ed"><form method="dialog" id="edf" onsubmit="return false">
  <label class="f">단어<input id="e-w" type="text"></label>
  <label class="f">뜻 (한 줄에 하나)<textarea id="e-m" rows="5"></textarea></label>
  <label class="f">메모<textarea id="e-n" rows="2"></textarea></label>
  <p class="hint" id="e-h"></p>
  <div class="btns"><button class="btn pri" id="e-save" type="button">저장</button><button class="btn dng" id="e-del" type="button">삭제</button><button class="btn" id="e-x" type="button">닫기</button></div>
</form></dialog>
<div id="toast" hidden></div>
<script>
const CFG=window.APP_CONFIG||{};
const SB=CFG.SB||'https://rtvvajhsnwkkrmncyfbs.supabase.co',ANON=CFG.ANON||'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3000)};
const guard=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message)}};
const wkey=x=>String(x||'').trim().toLowerCase(),lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);

/* ---------- 로그인 / REST ---------- */
let SES=null;try{SES=JSON.parse(localStorage.getItem('diti_ses')||'null')}catch(e){}
const saveSes=s=>{SES=s;try{s?localStorage.setItem('diti_ses',JSON.stringify(s)):localStorage.removeItem('diti_ses')}catch(e){}};
async function gotrue(grant,body){const r=await fetch(`${SB}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||'로그인 실패');j.expires_at=Date.now()+j.expires_in*1000;return j}
let rf=null;
async function token(){if(!SES)throw new Error('로그인이 필요해요');if(SES.expires_at-Date.now()<60000){rf=rf||gotrue('refresh_token',{refresh_token:SES.refresh_token}).then(saveSes).finally(()=>{rf=null});await rf}return SES.access_token}
async function api(method,path,body){
  const r=await fetch(SB+path,{method,headers:{apikey:ANON,Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.error))||('HTTP '+r.status));return j;
}
async function getAll(path){const out=[];for(let o=0;;o+=1000){const p=await api('GET',`${path}${path.includes('?')?'&':'?'}limit=1000&offset=${o}`);out.push(...p);if(p.length<1000)break}return out}

/* ---------- 상태 ---------- */
let W=[],U=new Map(),R=[];   // 단어장, 단어별 bkbk 사용 횟수, 검색 결과
const sortW=()=>W.sort((a,b)=>String(a.word).localeCompare(String(b.word),'ko'));
async function loadAll(){
  const [w,u]=await Promise.all([getAll('/rest/v1/diti_words?select=*&order=id'),getAll('/rest/v1/bkbk_word_use?select=word_id&order=id').catch(()=>[])]);
  W=w;sortW();U=new Map();u.forEach(x=>{const k=String(x.word_id);U.set(k,(U.get(k)||0)+1)});renderW();$('#tw').textContent=`단어장 ${W.length}`;
}
const cnt=()=>$('#tw').textContent=`단어장 ${W.length}`;

/* ---------- 탭 ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#ps').hidden=b.dataset.t!=='s';$('#pw2').hidden=b.dataset.t!=='w';
  (b.dataset.t==='s'?$('#q'):$('#wq')).focus();
});

/* ---------- 검색 ---------- */
const has=w=>W.find(x=>wkey(x.word)===wkey(w));
async function search(){
  const q=$('#q').value.trim();if(!q)return toast('단어를 입력하세요');
  $('#sb').disabled=true;$('#res').innerHTML='<p class="empty">찾는 중…</p>';
  try{
    const r=await fetch(`${SB}/functions/v1/krdict`,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({q})});
    const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error((d.error||d.message||'HTTP '+r.status));
    R=d.items||[];
    $('#res').innerHTML=R.length?R.map((it,i)=>`<div class="ent" data-i="${i}"><div class="eh"><b class="w">${E(it.word)}</b>${it.pos?`<span class="pos">${E(it.pos)}</span>`:''}<span class="have"${has(it.word)?'':' hidden'}>✔ 단어장에 있음</span></div>
      <div>${it.senses.map((s,j)=>`<label class="sl"><input type="checkbox" data-s="${j}"><span>${j+1}. ${E(s)}</span></label>`).join('')}</div>
      <div class="eb"><button class="btn sm pri" data-save="${i}">선택한 뜻 담기</button><button class="btn sm" data-all="${i}">전체 선택</button></div></div>`).join(''):`<p class="empty">'${E(q)}' 검색 결과가 없어요. 다른 단어로 찾아보세요.</p>`;
  }catch(e){$('#res').innerHTML=`<p class="empty">검색하지 못했어요: ${E(e.message)}</p>`}
  finally{$('#sb').disabled=false}
}
const saveSenses=guard(async i=>{
  const it=R[i],box=document.querySelector(`.ent[data-i="${i}"]`),picked=[...box.querySelectorAll('input[data-s]:checked')].map(c=>it.senses[+c.dataset.s]);
  if(!picked.length)return toast('담을 뜻을 먼저 선택하세요');
  const ex=has(it.word);
  if(ex){const old=lines(ex.meaning),add=picked.filter(p=>!old.includes(p.trim()));
    if(!add.length)return toast('이미 단어장에 있는 뜻이에요');
    const r=await api('PATCH',`/rest/v1/diti_words?id=eq.${ex.id}`,{meaning:[...old,...add].join('\n')});ex.meaning=r[0].meaning;toast(`'${ex.word}'에 뜻 ${add.length}개를 더했어요`)}
  else{const r=await api('POST','/rest/v1/diti_words',{id:crypto.randomUUID(),word:it.word.trim(),meaning:picked.join('\n'),note:''});W.push(r[0]);sortW();toast(`'${it.word}'를 단어장에 담았어요`)}
  box.querySelectorAll('input[data-s]').forEach(c=>c.checked=false);box.querySelector('.have').hidden=false;cnt();renderW();
});
$('#res').onclick=e=>{const s=e.target.closest('[data-save]'),a=e.target.closest('[data-all]');if(s)saveSenses(+s.dataset.save);if(a)document.querySelectorAll(`.ent[data-i="${a.dataset.all}"] input[data-s]`).forEach(c=>c.checked=true)};
$('#sb').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)search()});

/* ---------- 단어장 ---------- */
function renderW(){
  const q=wkey($('#wq').value),L=W.filter(w=>!q||wkey(w.word).includes(q)||wkey(w.meaning).includes(q));
  $('#wl').innerHTML=L.map(w=>{const n=U.get(String(w.id))||0;return `<div class="row" data-id="${w.id}"><b>${E(w.word)}</b><span class="u">${n?'×'+n:''}</span><span class="m">${E(lines(w.meaning).join(' / '))}</span></div>`}).join('')||`<p class="empty">${W.length?'찾는 단어가 없어요':'아직 담은 단어가 없어요. 검색 탭에서 담아 보세요.'}</p>`;
}
$('#wq').oninput=renderW;
let EID=null;
$('#wl').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const w=W.find(x=>String(x.id)===r.dataset.id);if(!w)return;EID=w.id;
  $('#e-w').value=w.word;$('#e-m').value=w.meaning||'';$('#e-n').value=w.note||'';
  const n=U.get(String(w.id))||0;$('#e-del').disabled=n>0;$('#e-h').textContent=n?`bkbk에서 ${n}번 쓰인 단어라 삭제할 수 없어요 (뜻·메모는 고칠 수 있어요)`:'';
  $('#ed').showModal()};
$('#e-x').onclick=()=>$('#ed').close();
$('#e-save').onclick=guard(async()=>{
  const w=W.find(x=>x.id===EID),word=$('#e-w').value.trim();if(!word)return toast('단어를 입력하세요');
  if(W.some(x=>x.id!==EID&&wkey(x.word)===wkey(word)))return toast('이미 단어장에 있는 단어예요');
  const r=await api('PATCH',`/rest/v1/diti_words?id=eq.${EID}`,{word,meaning:lines($('#e-m').value).join('\n'),note:$('#e-n').value.trim()});
  Object.assign(w,r[0]);sortW();renderW();$('#ed').close();toast('저장했어요');
});
$('#e-del').onclick=guard(async()=>{
  const w=W.find(x=>x.id===EID);if((U.get(String(EID))||0)>0)return toast('bkbk에서 쓰인 단어는 삭제할 수 없어요');
  if(!confirm(`'${w.word}'을(를) 단어장에서 삭제할까요?`))return;
  await api('DELETE',`/rest/v1/diti_words?id=eq.${EID}`);W=W.filter(x=>x.id!==EID);cnt();renderW();$('#ed').close();toast('삭제했어요');
});

/* ---------- 시작 ---------- */
$('#go').onclick=async()=>{$('#lmsg').textContent='';try{saveSes(await gotrue('password',{email:$('#em').value.trim(),password:$('#pw').value}));show()}catch(e){$('#lmsg').textContent=e.message}};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out').onclick=()=>{saveSes(null);show()};
function show(){$('#login').hidden=!!SES;$('#app').hidden=!SES;if(SES){guard(loadAll)();$('#q').focus()}}
show();
</script>
</body>
</html>
