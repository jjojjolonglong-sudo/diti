<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 한국어-영어 사전 앱</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 25px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #result { line-height: 1.6; color: #444; }
    .word-card { background: #f8f9fa; border-left: 4px solid #007bff; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
    .word-title { font-size: 22px; font-weight: bold; color: #111; margin-bottom: 5px; }
    .phonetic { font-size: 14px; color: #666; font-style: italic; margin-bottom: 10px; }
    .meaning-group { margin-top: 10px; }
    .pos { font-size: 13px; color: #fff; background: #28a745; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 5px; }
    .definition { font-size: 15px; color: #333; margin-left: 5px; }
    .error-msg { text-align: center; color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 실시간 사전 검색 앱</h1>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="검색할 영어 단어를 입력하세요 (예: book, happy, computer)" onkeypress="if(event.keyCode==13) searchWord()">
      <button onclick="searchWord()">검색</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    async function searchWord() {
      const word = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!word) {
        resultDiv.innerHTML = '<p class="error-msg">단어를 입력해주세요.</p>';
        return;
      }

      resultDiv.innerHTML = '<p style="text-align:center; color:#666;">정식 사전 데이터를 조회 중입니다...</p>';

      // 깃허브 페이지(HTTPS) 환경에서 CORS 보안 제약을 전혀 받지 않는 정식 데이터 백엔드 주소 사용
      const apiUrl = `https://dictionaryapi.dev{encodeURIComponent(word)}`;

      try {
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          resultDiv.innerHTML = '<p class="error-msg">사전에서 단어를 찾을 수 없거나 결과가 없습니다.</p>';
          return;
        }

        const data = await response.json();
        const entry = data[0]; // 검색된 첫 번째 정식 표제어 정보 추출

        let htmlContent = `
          <div class="word-card">
            <div class="word-title">${entry.word}</div>
            <div class="phonetic">${entry.phonetic || ''}</div>
        `;

        // 여러 개의 품사와 정의(뜻) 데이터를 안전하게 루프 돌며 바인딩
        entry.meanings.forEach(meaning => {
          htmlContent += `
            <div class="meaning-group">
              <span class="pos">${meaning.partOfSpeech}</span>
              <div class="definition">1. ${meaning.definitions[0].definition}</div>
              ${meaning.definitions[1] ? `<div class="definition">2. \${meaning.definitions[1].definition}</div>` : ''}
            </div>
          `;
        });

        htmlContent += `</div>`;
        resultDiv.innerHTML = htmlContent;

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = '<p class="error-msg">네트워크 응답 오류 또는 일시적인 서버 문제입니다.</p>';
      }
    }
  </script>

</body>
</html>
