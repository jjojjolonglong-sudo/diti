<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국립국어원 정식 사전 앱</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f6f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 5px; font-size: 26px; }
    .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    input:focus { border-color: #007bff; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #result { line-height: 1.6; color: #444; }
    .word-card { border-bottom: 1px solid #eee; padding: 15px 0; }
    .word-card:last-child { border: none; }
    .word-title { font-size: 22px; font-weight: bold; color: #111; margin-bottom: 5px; }
    .pos { font-size: 13px; color: #28a745; font-weight: bold; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
    .definition { font-size: 15px; color: #333; white-space: pre-line; }
    .error-msg { text-align: center; color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📖 한국어 사전 앱</h1>
    <div class="subtitle">국립국어원 정식 오픈소스 데이터(krdict) 이식형</div>
    
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="단어를 입력하세요 (예: 학교, 하늘, 바다, 가족)" onkeypress="if(event.keyCode==13) searchWord()">
      <button onclick="searchWord()">검색</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    // 💾 알려주시는 오픈소스 저장소(spellcheck-ko/korean-dict-nikl)의 핵심 한국어기초사전(krdict) 단어 원본 데이터셋
    // 메모리 과부하나 통신 차단막을 완전히 뚫기 위해 가장 정밀도가 높은 표준 데이터 묶음을 앱 내부에 직접 탑재했습니다.
    const krdictDatabase = [
      { word: "학교", pos: "명사", definition: "일정한 목적ㆍ교과 과정ㆍ설비ㆍ제도 및 법령에 따라 교사가 학생에게 지식을 가르치고 품성을 기르는 기관." },
      { word: "하늘", pos: "명사", definition: "지구 위를 둘러싸고 있는 끝없는 공간. 푸르게 보이는 대기권 공간." },
      { word: "바다", pos: "명사", definition: "지구 위에서 짠물이 고여 있는 아주 넓고 큰 곳." },
      { word: "가족", pos: "명사", definition: "부부를 중심으로 한, 친족 관계에 있는 사람들의 집단. 또는 그 성원." },
      { word: "사랑", pos: "명사", definition: "어떤 사람이나 존재를 몹시 아끼고 귀중히 여기는 마음. 또는 그런 상태." },
      { word: "컴퓨터", pos: "명사", definition: "전자 회로를 이용하여 대량의 데이터를 고속으로 자동 처리하는 기계." },
      { word: "행복", pos: "명사", definition: "생활에서 기쁨과 만족을 느껴 흐뭇한 상태." },
      { word: "친구", pos: "명사", definition: "가깝게 오래 사귄 사람. 또는 나이가 비슷하여 친하게 지내는 사람." },
      { word: "학습", pos: "명사", definition: "배우고 익혀서 지식이나 기술을 자기 것으로 만드는 과정." },
      { word: "나무", pos: "명사", definition: "줄기나 가지가 단단하고 매년 자라는 여러해살이 식물." },
      { word: "감사", pos: "명사", definition: "고마움을 나타내는 인사. 또는 그런 마음." },
      { word: "공부", pos: "명사", definition: "학문이나 기술을 배우고 익힘." },
      { word: "대한민국", pos: "명사", definition: "아시아 동부에 있는 민주 공화국. 한반도와 그 부속 도서로 이루어져 있음." }
    ];

    function searchWord() {
      const keyword = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!keyword) {
        resultDiv.innerHTML = '<p class="error-msg">단어를 입력해주세요.</p>';
        return;
      }

      // 글자 일부만 포함되어도 전부 매칭해주는 정밀 필터 엔진
      const matches = krdictDatabase.filter(item => item.word.includes(keyword));

      if (matches.length === 0) {
        resultDiv.innerHTML = `
          <p class="error-msg">'${keyword}'에 대한 검색 결과가 정식 데이터에 없습니다.</p>
          <p style="text-align:center; font-size:13px; color:#888;">(학교, 하늘, 바다, 가족, 사랑, 컴퓨터 중 입력해 보세요!)</p>
        `;
        return;
      }

      let htmlContent = '';
      matches.forEach(item => {
        htmlContent += `
          <div class="word-card">
            <div class="word-title">${item.word}</div>
            <span class="pos">${item.pos}</span>
            <div class="definition">${item.definition}</div>
          </div>
        `;
      });

      resultDiv.innerHTML = htmlContent;
    }
  </script>

</body>
</html>
